<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101122"><title>无限世界 · 互动冒险</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#f2efff;background:#0c0d19}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -20%,#41306d 0%,transparent 52%),#0c0d19;min-height:100vh}button,input,textarea,select{font:inherit}button{cursor:pointer}header{padding:20px 18px 12px;display:flex;align-items:center;justify-content:space-between;max-width:850px;margin:auto}.logo{font-size:23px;font-weight:850;letter-spacing:2px}.logo span{color:#c3a4ff}.sub{font-size:11px;color:#a8a4c5;margin-top:4px}.pill{font-size:11px;background:#29223d;color:#d4c1ff;border:1px solid #574274;padding:7px 10px;border-radius:40px}main{max-width:850px;margin:auto;padding:8px 16px 95px}.panel{background:#191a2c;border:1px solid #34324e;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 12px 30px #0002}.hero{padding:30px 22px;background:linear-gradient(130deg,#3c275d,#171b35 70%);position:relative;overflow:hidden}.hero:after{content:'✧';position:absolute;right:22px;top:4px;font-size:110px;color:#ffffff12}.hero h1{margin:0 0 9px;font-size:28px}.muted{color:#b6b3cb;font-size:13px;line-height:1.7}.eyebrow{font-size:12px;color:#c4a5ff;font-weight:700;letter-spacing:2px}h2{font-size:18px;margin:0 0 15px}label{display:block;font-size:13px;color:#ddd8f4;margin:15px 0 7px}input,textarea,select{width:100%;background:#101121;border:1px solid #45405e;color:white;padding:13px;border-radius:11px;outline:none}textarea{min-height:85px;resize:vertical}input:focus,textarea:focus,select:focus{border-color:#b38bff}.btn{background:linear-gradient(90deg,#9263f3,#6d61db);border:0;color:white;border-radius:12px;padding:13px 18px;font-weight:750}.btn.secondary{background:#2b2943;border:1px solid #555070}.btn.danger{background:#412b3b;border:1px solid #754458}.wide{width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.world{border:1px solid #50446f;border-radius:13px;padding:15px;background:#222038;text-align:left;color:white}.world strong{display:block;margin-bottom:6px}.world small{color:#a9a4c2}.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;border:1px solid #403b57;background:#1a1a2d;color:#c5c0da;padding:11px 4px;border-radius:12px}.tab.active{background:#493574;border-color:#9873d5;color:white}.hide{display:none!important}.stat{background:#25233b;border-radius:11px;padding:10px;text-align:center}.stat b{display:block;font-size:19px;margin-top:5px;color:#e7d7ff}.stat small{color:#b2aacd}.story{background:#141525;border:1px solid #34334b;padding:15px;border-radius:13px;line-height:1.85;font-size:14px;white-space:pre-wrap;margin:12px 0}.story.player{background:#27213f;border-color:#544375}.story .tag{font-size:11px;color:#b99bf6;font-weight:bold;margin-bottom:6px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.choice{background:#2c2844;color:#e4d9ff;border:1px solid #51476d;border-radius:22px;padding:9px 12px;font-size:12px}.row{display:flex;gap:8px;align-items:center}.row>*:first-child{flex:1}.bar{height:6px;background:#3c354b;border-radius:9px;overflow:hidden;margin-top:7px}.bar i{display:block;background:#a27cff;height:100%}.notice{background:#29223b;border:1px solid #51446e;padding:12px;border-radius:11px;color:#c9b6ec;font-size:12px;line-height:1.6}.inventory{display:flex;gap:7px;flex-wrap:wrap}.item{border-radius:30px;background:#2d2944;border:1px solid #524a70;padding:8px 12px;font-size:12px}footer{color:#77738d;text-align:center;font-size:11px;padding:20px}@media(max-width:430px){.grid{grid-template-columns:1fr 1fr}.hero h1{font-size:25px}.panel{padding:15px}}@media(min-width:600px){.grid.worldgrid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><div><div class="logo">✦ <span>无限</span>世界</div><div class="sub">每一次选择，都是新的命运</div></div><span class="pill">试玩版 v0.1</span></header><main>
<section id="home"><div class="panel hero"><div class="eyebrow">YOUR WORLD · YOUR STORY</div><h1>创造属于你的宇宙</h1><p class="muted">从修仙到末日，从魔法到星际。创造世界、扮演角色、自由决定自己的冒险。</p><button class="btn" onclick="show('create')">＋ 创建新世界</button></div><div class="panel"><h2>我的世界</h2><div id="worlds" class="grid worldgrid"></div><p class="muted" id="empty">还没有世界。创建一个，开启你的第一场冒险。</p></div><div class="notice">当前为离线剧情原型：故事由内置规则生成，并非真正 AI。数据保存在当前浏览器中，清除浏览器数据可能导致存档丢失。</div></section>
<section id="create" class="hide"><div class="panel"><h2>✦ 创造新世界</h2><label>世界名称</label><input id="worldName" maxlength="40" placeholder="例如：九霄仙域"><label>世界类型</label><select id="genre"><option>修仙玄幻</option><option>西方魔法</option><option>末日生存</option><option>星际科幻</option><option>都市异能</option><option>自由幻想</option></select><label>世界背景与规则</label><textarea id="lore" maxlength="800" placeholder="例如：九大仙宗统治大陆，灵气逐年衰退，古老遗迹即将苏醒……"></textarea><label>角色名字</label><input id="heroName" maxlength="30" placeholder="例如：林尘"><label>角色身份</label><input id="role" maxlength="80" placeholder="例如：初入宗门的外门弟子"><div class="row" style="margin-top:20px"><button class="btn secondary" onclick="show('home')">返回</button><button class="btn" onclick="createWorld()">进入世界 →</button></div></div></section>
<section id="game" class="hide"><div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="show('home')">← 世界列表</button><button class="btn danger" onclick="resetCurrent()">重开冒险</button></div><div class="panel"><div class="eyebrow" id="genreTitle"></div><h2 id="gameTitle" style="margin:6px 0"></h2><div class="muted" id="gameLore"></div><div class="tabs" style="margin-top:17px"><button id="storyTab" class="tab active" onclick="tab('story')">📜 剧情</button><button id="profileTab" class="tab" onclick="tab('profile')">👤 角色</button></div><div id="storyPage"><div id="messages"></div><div id="choices" class="choices"></div><div class="row"><input id="action" maxlength="250" placeholder="输入你的行动，例如：探索附近的山洞" onkeydown="if(event.key==='Enter')advance()"><button class="btn" onclick="advance()">行动</button></div><p class="muted" style="font-size:11px">自由输入支持关键词触发的规则剧情；其他行动也会得到通用反馈。</p></div><div id="profilePage" class="hide"><div class="grid" id="stats"></div><h2 style="margin-top:22px">🎒 背包</h2><div id="inventory" class="inventory"></div><h2 style="margin-top:22px">📖 世界设定</h2><p id="profileLore" class="muted"></p></div></div></section>
<footer>无限世界 · 本地试玩原型 · 不收集账号或个人信息</footer></main><script>
const KEY='infinite_world_demo_v1';let db=[],current=null;try{db=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(db))db=[]}catch{db=[]}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch{alert('浏览器无法保存数据，请检查存储设置')}}function el(id){return document.getElementById(id)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function show(page){['home','create','game'].forEach(id=>el(id).classList.toggle('hide',id!==page));if(page==='home')renderWorlds();if(page==='game')renderGame();window.scrollTo(0,0)}function renderWorlds(){el('worlds').innerHTML=db.map((w,i)=>`<button class="world" onclick="openWorld(${i})"><strong>✧ ${escapeHTML(w.name)}</strong><small>${escapeHTML(w.genre)} · ${escapeHTML(w.hero)}<br>第 ${w.turn+1} 幕 · 继续冒险 →</small></button>`).join('');el('empty').classList.toggle('hide',db.length>0)}function opening(w){const intro={'修仙玄幻':'薄雾笼罩山门，古钟忽然响起。你在石阶上醒来，怀中有一枚微微发烫的玉符。','西方魔法':'王城的钟声敲过午夜，魔法学院的禁书塔突然亮起一道蓝光。','末日生存':'城市停电已经七天。远处传来警报，背包里的最后一瓶水轻轻晃动。','星际科幻':'飞船跃迁失败，你在未知星域苏醒。雷达显示一颗没有登记的行星。','都市异能':'下班回家的路上，整座城市的时间突然停了一秒，只有你还能够移动。','自由幻想':'一道神秘的门在你眼前打开，门后的世界正等待第一个踏入者。'};return `${intro[w.genre]||intro['自由幻想']}\n\n${w.hero}，你的身份是「${w.role}」。你决定怎么做？`}
function createWorld(){const name=el('worldName').value.trim(),hero=el('heroName').value.trim();if(!name||!hero){alert('请填写世界名称和角色名字');return}const w={id:Date.now()+'-'+Math.random().toString(36).slice(2),name,genre:el('genre').value,lore:el('lore').value.trim()||'这是一个等待探索的神秘世界。',hero,role:el('role').value.trim()||'无名旅人',turn:0,hp:100,energy:100,gold:10,level:1,items:['旅行背包','旧地图'],history:[]};w.history=[{who:'narrator',text:opening(w)}];db.unshift(w);save();current=w.id;show('game')}
function openWorld(i){current=db[i].id;show('game')}function active(){return db.find(w=>w.id===current)}function tab(name){el('storyPage').classList.toggle('hide',name!=='story');el('profilePage').classList.toggle('hide',name!=='profile');el('storyTab').classList.toggle('active',name==='story');el('profileTab').classList.toggle('active',name==='profile')}function renderGame(){const w=active();if(!w)return show('home');el('genreTitle').textContent=w.genre+' · 第 '+(w.turn+1)+' 幕';el('gameTitle').textContent=w.name;el('gameLore').textContent=w.lore;el('profileLore').textContent=w.lore;el('messages').innerHTML=w.history.map(m=>`<div class="story ${m.who==='player'?'player':''}"><div class="tag">${m.who==='player'?escapeHTML(w.hero):'✧ 世界叙事'}</div>${escapeHTML(m.text)}</div>`).join('');el('stats').innerHTML=[['生命',w.hp],['体力',w.energy],['金币',w.gold],['等级',w.level]].map(([k,v])=>`<div class="stat"><small>${k}</small><b>${v}</b>${k==='生命'||k==='体力'?`<div class="bar"><i style="width:${v}%"></i></div>`:''}</div>`).join('');el('inventory').innerHTML=w.items.map(x=>`<span class="item">${escapeHTML(x)}</span>`).join('');const opts=w.turn%3===0?['探索附近','寻找线索','休息恢复']:w.turn%3===1?['与陌生人交谈','调查遗迹','查看背包']:['继续前进','尝试战斗','寻找宝物'];el('choices').innerHTML=opts.map(x=>`<button class="choice" onclick="quick(${JSON.stringify(x).replace(/"/g,'&quot;')})">${escapeHTML(x)}</button>`).join('');tab('story')}
function quick(x){el('action').value=x;advance()}function advance(){const w=active();if(!w)return;const a=el('action').value.trim();if(!a)return;el('action').value='';w.history.push({who:'player',text:a});w.turn++;const s=w.turn;let response='';if(/休息|睡|恢复|疗伤/.test(a)){w.energy=Math.min(100,w.energy+25);w.hp=Math.min(100,w.hp+10);response=`你找到一处安全的角落，稍作休息。疲惫逐渐消退，呼吸重新平稳。\n\n生命 +10（最多100），体力 +25（最多100）。`}else if(/战斗|攻击|打|挑战|决斗/.test(a)){const damage=8+(s*7)%13;w.hp=Math.max(1,w.hp-damage);w.energy=Math.max(0,w.energy-12);w.gold+=5;response=`你主动迎向危险，经过一番激烈交锋，终于迫使对手退却。你从战场上拾起几枚钱币。\n\n生命 -${damage}，体力 -12，金币 +5。`}else if(/宝物|搜索|搜寻|拾取|捡|探索|调查|遗迹|山洞/.test(a)){const finds=['古旧铜钥匙','闪光碎片','神秘药草','刻纹石片','星砂'];const found=finds[(s-1)%finds.length];if(!w.items.includes(found))w.items.push(found);w.energy=Math.max(0,w.energy-5);response=`你沿着隐秘的痕迹深入探索。阴影中，一件被遗忘的物品引起你的注意。你谨慎地将它收入背包。\n\n获得「${found}」，体力 -5。远处似乎还有新的秘密。`}else if(/交谈|说话|询问|问|聊天/.test(a)){response=`你走向一位神色谨慎的旅人。对方低声说：“这片地方最近发生了不寻常的变化。若你愿意寻找真相，就留意那些被遗忘的标记。”\n\n你获得了一条模糊的线索。`}else if(/背包|属性|状态/.test(a)){response=`你检查随身物品和当前状态。\n\n背包：${w.items.join('、')}。\n生命 ${w.hp}，体力 ${w.energy}，金币 ${w.gold}。`}else{const scenes=['空气中出现一丝异样的波动，你的行动引起了附近某个存在的注意。','你尝试按自己的想法行动。周围环境发生了细微变化，新的道路渐渐显露。','你的选择改变了眼前的局势。远处传来轻微的响动，仿佛有什么正在靠近。','这次行动没有立刻得到答案，但你察觉到一个值得追查的细节。'];response=`你决定：${a}。\n\n${scenes[s%scenes.length]}\n\n接下来，你还可以自由选择行动。`}w.history.push({who:'narrator',text:response});save();renderGame();setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)}function resetCurrent(){const w=active();if(!w||!confirm('确定重新开始这个世界的冒险吗？原有剧情将被清空。'))return;w.turn=0;w.hp=100;w.energy=100;w.gold=10;w.level=1;w.items=['旅行背包','旧地图'];w.history=[{who:'narrator',text:opening(w)}];save();renderGame()}renderWorlds();
</script></body></html>
