<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101527"><title>斗罗大陆·魂师之路 私人试玩</title><style>:root{color-scheme:dark;--bg:#101527;--panel:#1b2440;--line:#394461;--gold:#f5cc7a;--text:#edf0fa;--sub:#aebad5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#28345b,#101527 65%);font:15px/1.6 system-ui,-apple-system,'PingFang SC',sans-serif;color:var(--text)}main{max-width:740px;margin:auto;padding:18px 14px 65px}h1{font-size:25px;margin:4px 0;color:var(--gold)}h2{font-size:17px;margin:0 0 10px;color:var(--gold)}p{margin:8px 0}.muted,small{color:var(--sub)}.card{background:#1b2440ed;border:1px solid var(--line);border-radius:15px;padding:16px;margin:13px 0;box-shadow:0 8px 25px #0002}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.between{justify-content:space-between}button,select,input{font:inherit;border-radius:9px}button{border:1px solid #6a6c95;background:#333f6c;color:#fff;padding:10px 13px;cursor:pointer}button.primary{background:#8e68d8;border-color:#b09cf1;font-weight:700}button:disabled{opacity:.45}input,select{background:#11192f;border:1px solid #596586;color:white;padding:10px;max-width:100%;width:100%}label{display:block;margin:10px 0 5px;color:var(--sub)}.pill{display:inline-block;background:#293657;border:1px solid #536082;border-radius:30px;padding:3px 9px;margin:3px;font-size:12px}.log{max-height:380px;overflow:auto;background:#11192e;border-radius:10px;padding:12px;white-space:pre-wrap;line-height:1.75}.log p{border-bottom:1px solid #303a54;padding-bottom:9px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.stat{background:#141d36;border-radius:9px;padding:10px}.stat b{color:var(--gold)}.hidden{display:none}.notice{border-left:3px solid var(--gold);padding-left:10px;color:#d9dff0}.actions button{flex:1 1 130px}.danger{color:#ffb7b7}.success{color:#a8eac4}</style></head><body><main><div class="row between"><div><h1>⚔️ 斗罗大陆 · 魂师之路</h1><small>私人同人试玩 v1.0 · 免费离线规则引擎</small></div><button id="reset" style="font-size:12px">重开人生</button></div><section id="setup" class="card"><h2>创建你的魂师</h2><label>姓名</label><input id="heroName" value="林辰" maxlength="16"><label>出身</label><select id="origin"><option value="村庄少年">村庄少年（体魄+2）</option><option value="学院学徒">学院学徒（悟性+2）</option><option value="猎魂人后代">猎魂人后代（战力+2）</option></select><p class="muted">武魂与先天魂力将在觉醒仪式中随机决定。每次开局不同。</p><button class="primary" id="start">开始武魂觉醒</button></section><section id="game" class="hidden"><div class="card"><div class="row between"><h2 id="who"></h2><span id="clock" class="pill"></span></div><div id="stats" class="grid"></div><div id="rings"></div><div id="skills"></div></div><div class="card"><h2>🗺️ 所在地区</h2><p id="place"></p><div id="travel" class="row actions"></div></div><div class="card"><h2>🎮 你的行动</h2><div id="actions" class="row actions"></div><label>自由输入（识别常见行动关键词）</label><div class="row"><input id="command" placeholder="例如：修炼、去森林、挑战魂兽、和院长交谈" style="flex:1 1 200px"><button id="send" class="primary">行动</button></div><p class="muted" style="font-size:12px">离线模式不能真正理解所有句子；无法识别时会提示可执行动作，不会假装成功。</p></div><div class="card"><h2>📜 世界动态与经历</h2><div id="logs" class="log"></div></div><div class="card"><h2>🎒 背包 / 关系 / 世界</h2><p id="inventory"></p><p id="relations"></p><p id="world"></p><div class="row"><button id="export">导出存档</button><button id="importBtn">导入存档</button><input id="importFile" type="file" accept="application/json,.json" class="hidden"></div></div></section><footer class="muted" style="font-size:12px">非官方个人同人原型；不包含原作正文、插画或音频。游戏进度保存在当前浏览器中。</footer></main><script>
(()=>{'use strict';const KEY='douluo_private_v1', $=id=>document.getElementById(id);let s=null;const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[rand(0,a.length-1)];const martial=[{name:'蓝银草',type:'控制',power:2},{name:'昊天锤',type:'强攻',power:7},{name:'七宝琉璃塔',type:'辅助',power:3},{name:'柔骨兔',type:'敏攻',power:5},{name:'幽冥灵猫',type:'敏攻',power:5},{name:'玄铁剑',type:'强攻',power:4},{name:'寒霜藤',type:'控制',power:4},{name:'赤焰狮',type:'强攻',power:6},{name:'清风羽',type:'敏攻',power:3}];const locations={村庄:{desc:'宁静的村庄，村民忙于收获，觉醒殿的执事每隔数日来访。',links:['学院','集市']},学院:{desc:'初级魂师学院，导师指导修炼，学生们会结伴去猎魂。',links:['村庄','集市','猎魂森林']},集市:{desc:'商贩售卖药草和补给，物价受森林安全与商队影响。',links:['村庄','学院','猎魂森林']},猎魂森林:{desc:'森林深处魂兽出没，危险程度高于城镇。',links:['学院','集市','森林深处']},森林深处:{desc:'强大魂兽的领地，低等级魂师独行极其危险。',links:['猎魂森林']}};const beasts=[{name:'风纹狼',min:10,max:90,atk:4,skill:'疾风爪'},{name:'铁甲猪',min:40,max:190,atk:6,skill:'铁甲护体'},{name:'碧鳞蛇',min:90,max:430,atk:9,skill:'毒雾缠绕'},{name:'雷角鹿',min:180,max:850,atk:12,skill:'雷霆冲撞'},{name:'影刃豹',min:400,max:1800,atk:17,skill:'影刃突袭'}];const safe=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function log(t){s.logs.unshift('第'+s.day+'天 · '+t);s.logs=s.logs.slice(0,80)}function save(){localStorage.setItem(KEY,JSON.stringify(s));render()}function tick(n=1){for(let i=0;i<n;i++){s.day++;s.energy=Math.min(100,s.energy+12);if(s.day%3===0){let e=pick(['商队安全抵达，集市补给增加。','猎魂队遭遇袭击，森林警戒提高。','学院举办比试，导师正在招募学生。','村民发现药草，集市货源增加。','魂兽迁徙，森林危险程度变化。']);if(e.includes('安全'))s.market=Math.max(0,s.market-1);if(e.includes('袭击'))s.danger=Math.min(5,s.danger+1);if(e.includes('药草'))s.market=Math.max(0,s.market-1);if(e.includes('迁徙'))s.danger=rand(0,5);log('【世界事件】'+e)}if(s.day%5===0){s.npcs.院长.mood=pick(['平静','忙碌','高兴']);s.npcs.商人.mood=pick(['谨慎','热情','焦虑']);log('【人物动态】学院院长与集市商人的日常状态发生变化。')}}}function create(){let m=pick(martial),origin=$('origin').value;let innate=rand(1,10);s={version:1,name:$('heroName').value.trim()||'无名魂师',origin,martial:m,innate,level:innate,xp:0,hp:100,energy:100,coins:40,day:1,place:'村庄',rings:[],skills:[],bag:{药草:2},logs:[],danger:1,market:1,npcs:{院长:{friend:0,mood:'平静'},商人:{friend:0,mood:'谨慎'},猎魂队长:{friend:0,mood:'忙碌'}},pending:null};if(origin==='村庄少年')s.hp+=20;if(origin==='学院学徒')s.xp+=8;if(origin==='猎魂人后代')s.energy+=10;log('武魂觉醒：'+m.name+'（'+m.type+'系），先天魂力'+innate+'级。');log('你在村庄觉醒殿前，魂师之路从这里开始。');save()}function expNeed(){return 16+s.level*6}function canAdvance(){return s.level%10!==0||s.rings.length>=Math.floor(s.level/10)}function cultivate(){if(s.energy<15){log('精力不足，先休息。');return}if(s.level>=99){log('当前试玩版修炼上限为99级。');return}if(!canAdvance()){log('魂力达到瓶颈！需要猎取并吸收魂环，才能继续提升。');return}s.energy-=15;let x=rand(6,12)+Math.floor(s.innate/3);s.xp+=x;log('静心修炼，获得'+x+'点修炼进度。');while(s.xp>=expNeed()&&canAdvance()&&s.level<99){s.xp-=expNeed();s.level++;s.hp=Math.min(160,s.hp+4);log('魂力提升至'+s.level+'级！');if(!canAdvance()){s.xp=0;log('到达十级关口，必须吸收魂环。');break}}tick(1)}function rest(){s.energy=100;s.hp=Math.min(160,s.hp+25);tick(1);log('休息了一天，精力恢复，伤势有所好转。')}function travel(to){if(!locations[s.place].links.includes(to)){log('无法直接到达'+to+'。');return}s.place=to;s.pending=null;tick(1);log('你抵达'+to+'。'+locations[to].desc)}function talk(){let person=s.place==='学院'?'院长':s.place==='集市'?'商人':s.place.includes('森林')?'猎魂队长':'院长';let n=s.npcs[person];n.friend+=rand(1,3);let msg=person==='院长'?'院长提醒：魂力每十级需获得一个魂环，切勿冒险吸收超出承受范围的魂环。':person==='商人'?'商人说：森林危险时药草会涨价，带好补给再出发。':'猎魂队长说：年限越高的魂兽越危险，量力而行。';log('你与'+person+'交谈（关系+'+n.friend+'，心情：'+n.mood+'）。'+msg);tick(1)}function forage(){if(s.energy<10){log('精力不足。');return}s.energy-=10;let found=rand(0,2);s.bag.药草=(s.bag.药草||0)+found;log(found?'你仔细搜寻，找到'+found+'株药草。':'搜寻许久，没有发现可用的药草。');tick(1)}function shop(){if(s.place!=='集市'){log('需要前往集市才能交易。');return}let price=8+s.market*3;if(s.coins<price){log('魂币不足，购买一株药草需要'+price+'魂币。');return}s.coins-=price;s.bag.药草=(s.bag.药草||0)+1;log('花费'+price+'魂币购买一株药草。');tick(1)}function heal(){if((s.bag.药草||0)<1){log('背包里没有药草。');return}s.bag.药草--;s.hp=Math.min(160,s.hp+30);log('使用药草，恢复30点生命。')}function hunt(){if(!s.place.includes('森林')){log('请先前往猎魂森林。');return}if(s.energy<20||s.hp<15){log('状态太差，无法安全进行猎魂。');return}let candidates=s.place==='森林深处'?beasts.slice(2):beasts.slice(0,3);let b=pick(candidates),age=rand(b.min,b.max);let strength=s.level*2+s.martial.power*3+s.rings.length*10+rand(0,25);let threat=b.atk*4+Math.floor(age/20)+s.danger*3+rand(0,20);s.energy-=20;tick(1);if(strength>=threat){s.pending={beast:b.name,age,skill:b.skill};s.coins+=rand(2,8);log('战胜'+age+'年'+b.name+'！魂环出现，可以选择吸收（或放弃）。')}else{let dmg=Math.max(8,Math.floor((threat-strength)/2)+rand(5,15));s.hp=Math.max(1,s.hp-dmg);s.pending=null;log('遭遇'+age+'年'+b.name+'，战斗失利，损失'+dmg+'点生命，被迫撤退。');if(s.hp<20)log('伤势严重！建议先休息或使用药草。')}}function absorb(){if(!s.pending){log('当前没有可吸收的魂环。');return}if(s.level%10!==0||s.rings.length>=s.level/10){log('当前魂力尚未达到吸收下一魂环的条件。');return}let r=s.pending;let cap=s.rings.length===0?423:s.rings.length===1?764:1500+s.rings.length*2000;if(r.age>cap){s.hp=Math.max(1,s.hp-30);s.pending=null;log('魂环年限过高（'+r.age+'年），吸收失败，受到反噬！');return}s.rings.push(r);s.skills.push(r.skill);s.pending=null;log('成功吸收'+r.age+'年'+r.beast+'魂环，获得魂技「'+r.skill+'」！');tick(1)}function investigate(){let list=s.place.includes('森林')?['你发现魂兽脚印，判断附近存在猎食者。','远处传来枝叶折断声，你谨慎绕开危险地带。','你找到一处清泉，短暂恢复精神。']:['你听到居民谈论近期魂兽迁徙。','有人正在寻找结伴修炼的魂师。','你观察到商队准备启程，城镇正在忙碌。'];log(pick(list));tick(1)}function act(a){if(!s)return;switch(a){case'修炼':cultivate();break;case'休息':rest();break;case'交谈':talk();break;case'搜寻':forage();break;case'购买药草':shop();break;case'使用药草':heal();break;case'猎魂':hunt();break;case'吸收魂环':absorb();break;case'放弃魂环':s.pending=null;log('你放弃了眼前的魂环。');break;case'调查':investigate();break;default:log('无法识别此行动。你可以修炼、休息、交谈、调查、搜寻、猎魂、吸收魂环或前往地图地点。')}save()}function command(){let t=$('command').value.trim();$('command').value='';if(!t)return;let to=Object.keys(locations).find(k=>t.includes(k));if(to&&(t.includes('去')||t.includes('前往')||t.includes('移动')||t.includes('进入')))travel(to);else if(/吸收|获取魂环/.test(t))act('吸收魂环');else if(/放弃/.test(t))act('放弃魂环');else if(/修炼|冥想|打坐|突破/.test(t))act('修炼');else if(/休息|睡觉|恢复/.test(t))act('休息');else if(/猎魂|攻击|战斗|挑战|魂兽/.test(t))act('猎魂');else if(/交谈|聊天|对话|问候|院长|商人/.test(t))act('交谈');else if(/购买|买药/.test(t))act('购买药草');else if(/吃药|用药|治疗/.test(t))act('使用药草');else if(/搜寻|采集|找药/.test(t))act('搜寻');else if(/调查|观察|探索|查看/.test(t))act('调查');else {log('你尝试「'+t.slice(0,60)+'」，但离线规则引擎暂不支持这类复杂行动。可选择上方按钮或输入常见行动。');save()} }function render(){let active=!!s;$('setup').classList.toggle('hidden',active);$('game').classList.toggle('hidden',!active);if(!active)return;$('who').textContent=s.name+' · '+s.martial.name;$('clock').textContent='第 '+s.day+' 天';$('stats').innerHTML=[['魂力',s.level+'级'],['先天魂力',s.innate+'级'],['生命',s.hp],['精力',s.energy],['魂币',s.coins],['修炼进度',s.xp+'/'+expNeed()],['武魂类型',s.martial.type],['出身',s.origin]].map(([k,v])=>'<div class="stat"><small>'+safe(k)+'</small><br><b>'+safe(v)+'</b></div>').join('');$('rings').innerHTML='<p>魂环：'+(s.rings.length?s.rings.map(r=>'<span class="pill">'+safe(r.age+'年 '+r.beast)+'</span>').join(''):'尚未获得')+'</p>';$('skills').textContent='魂技：'+(s.skills.join('、')||'尚未获得');$('place').textContent=s.place+'：'+locations[s.place].desc;$('travel').innerHTML='';locations[s.place].links.forEach(x=>btn($('travel'),'前往'+x,()=>{travel(x);save()}));$('actions').innerHTML='';['修炼','休息','调查','交谈','搜寻','猎魂','吸收魂环','放弃魂环','购买药草','使用药草'].forEach(x=>btn($('actions'),x,()=>act(x),x==='吸收魂环'?!s.pending:x==='放弃魂环'?!s.pending:false));$('logs').innerHTML=s.logs.map(x=>'<p>'+safe(x)+'</p>').join('');$('inventory').textContent='背包：'+Object.entries(s.bag).map(([k,v])=>k+' ×'+v).join('、');$('relations').textContent='人物关系：'+Object.entries(s.npcs).map(([k,v])=>k+'（好感'+v.friend+'，'+v.mood+'）').join('；');$('world').textContent='世界状态：森林危险 '+s.danger+'/5；集市价格指数 '+s.market+'；'+(s.pending?'待吸收魂环：'+s.pending.age+'年'+s.pending.beast:'无待吸收魂环');function btn(parent,label,fn,disabled=false){let b=document.createElement('button');b.textContent=label;b.disabled=disabled;b.onclick=fn;parent.appendChild(b)}}$('start').onclick=create;$('send').onclick=command;$('command').addEventListener('keydown',e=>{if(e.key==='Enter')command()});$('reset').onclick=()=>{if(confirm('确定重开人生？当前存档将被覆盖。')){localStorage.removeItem(KEY);s=null;render()}};$('export').onclick=()=>{let blob=new Blob([JSON.stringify(s,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='魂师存档.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let v=JSON.parse(await f.text());if(v.version!==1||!v.name||!locations[v.place]||!Array.isArray(v.logs)||!v.martial||!v.npcs||!v.bag)throw Error('存档格式不正确');s=v;save()}catch(err){alert('导入失败：'+err.message)}};try{let v=JSON.parse(localStorage.getItem(KEY));if(v&&v.version===1&&locations[v.place]&&v.martial)s=v}catch(e){}render()})();
</script></body></html>
